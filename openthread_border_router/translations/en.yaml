---
configuration:
  device:
    name: Device
    description: The serial port where the OpenThread RCP radio is attached.
  baudrate:
    name: Baudrate
    description: >-
      The serial port baudrate used to communicate with the Silicon Labs radio.
  flow_control:
    name: Hardware flow control
    description: Enable hardware flow control for serial port.
  backbone_interface:
    name: Backbone Network Interface
    description: >-
      The network interface used for the backbone network.
      If not specified, it falls back to the primary interface.
  network_device:
    name: Network Device
    description: >-
      <host:port> when connecting to a device via sockets (takes precedence
      over above configuration). Not recommended! See documentation for more
      information.
  otbr_log_level:
    name: OpenThread Border Router agent log level
    description: >-
      Set logging level of the OpenThread Border Router agent (otbr-agent).
  firewall:
    name: OTBR firewall
    description: >-
      Use OpenThread Border Router firewall to block unnecessary traffic.
  nat64:
    name: NAT64
    description: >-
      Enable IPv6 to IPv4 network address translation. This allows Thread
      devices to communicate with devices on the Internet.
  tx_power:
    name: Transmit power
    description: >-
      Radio transmit power in dBm (default 6). Supported values depend on the
      radio and firmware. Higher power can cause asymmetric links.
  leader_weight:
    name: Leader weight
    description: >-
      Leader weight from 0 to 255, used when Thread partitions merge.
      Leave unset to keep OpenThread's default. This does not elect a new leader.
  take_leadership:
    name: Take leadership
    description: >-
      Request leadership after attaching, unless already leader (default off).
      This creates a new partition and can disrupt connectivity.
  omr_preference:
    name: Local OMR prefix preference
    description: >-
      Preference for this border router's local off-mesh-routable IPv6 prefix
      (low, med or high). Leave unset to keep OpenThread's automatic behavior.
  srp_anycast:
    name: SRP anycast
    description: >-
      Advertise the SRP server in anycast mode (default off). Border routing
      still controls when the server runs. See the documentation before enabling.
  srp_anycast_sequence_number:
    name: SRP anycast sequence number seed
    description: >-
      Initial sequence number from 0 to 255 (default 0). When SRP anycast is
      enabled, the saved number advances on each app start, wrapping after 255.
      Changing this seed resets the next number to the new value.
  beta:
    name: Beta
    description: >-
      Enable beta mode to run a newer, experimental version of OpenThread
      Border Router.
network:
  8080/tcp: OpenThread Web port
  8081/tcp: OpenThread REST API port
