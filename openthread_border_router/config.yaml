---
version: dev
breaking_versions: [3.0.0]
slug: openthread_border_router
name: OpenThread Border Router
description: OpenThread Border Router app
url: https://github.com/home-assistant/app-openthread-border-router
arch:
  - aarch64
  - amd64
homeassistant: 2025.7.0
gpio: true
hassio_api: true
discovery:
  - otbr
host_network: true
host_uts: true
privileged:
  - IPC_LOCK
  - NET_ADMIN
  - NET_RAW
devices:
  - /dev/net/tun
image: ghcr.io/home-assistant/app-openthread-border-router
init: false
options:
  device: null
  baudrate: "460800"
  flow_control: true
  advanced:
    otbr_log_level: notice
    firewall: true
    nat64: false
    beta: false
ports:
  8080/tcp: null
  8081/tcp: null
ports_description:
  8080/tcp: OpenThread Web port
  8081/tcp: OpenThread REST API port
schema:
  device: device(subsystem=tty)
  baudrate: list(57600|115200|230400|460800|921600|1000000)
  flow_control: bool
  network_device: str?
  advanced:
    otbr_log_level: >-
      list(debug|info|notice|warning|error|critical|alert|emergency)
    firewall: bool
    nat64: bool
    backbone_interface: str?
    beta: bool?
    tx_power: int(-128,127)?
    leader_weight: int(0,255)?
    router_eligible: list(enable|disable)?
    trel: list(enable|disable)?
    omr_mode: list(auto|custom|disabled)?
    omr_prefix: str?
    omr_preference: list(low|med|high)?
    route_preference: list(low|med|high)?
    rio_preference: list(low|med|high)?
    srp_address_mode: list(unicast|anycast)?
    srp_anycast_sequence_number: int(0,255)?
startup: services
